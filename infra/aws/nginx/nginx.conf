# E7 Phase 3 Sub-phase C -- TLS-terminating reverse proxy in front of
# `api` and `keycloak`. Written to /opt/compliance/nginx.conf by
# infra/aws/setup-tls.sh only AFTER certbot has issued a real cert (see
# nginx.bootstrap.conf, served up to that point instead). Both `api` and
# `keycloak` stay bound to 127.0.0.1-only host ports (docker-compose.prod.yml)
# -- this container reaches them over the compose network by service name,
# never through those loopback bindings, so they remain unreachable from
# the internet even if this proxy were ever misconfigured.
worker_processes auto;
events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Docker's embedded DNS (127.0.0.11) + a variable upstream forces nginx
  # to re-resolve api/keycloak on each new connection (bounded by valid=)
  # instead of the plain-string proxy_pass default of resolving once at
  # nginx startup and caching that IP forever. Without this, any
  # `docker compose up -d api` (deploy-stack.sh, on every app redeploy)
  # recreates the container with a new IP and every request 502s until
  # nginx itself is restarted -- confirmed live 2026-09-18, the first
  # redeploy after Sub-phase C stood up nginx.
  resolver 127.0.0.11 valid=10s;
  # Above apps/api's own 5MB xlsx-import limit (import-export.controller.ts,
  # MAX_FILE_SIZE_BYTES) so Nginx never rejects a request before the app's
  # own, already-tested limit gets a chance to.
  client_max_body_size 6m;

  server {
    listen 80;
    server_name compliance.ai-english-os.online;

    # Renewal (infra/aws/renew-cert.sh, installed by setup-tls.sh) reuses
    # this same webroot path -- keep serving the challenge even once TLS
    # is live, so certbot renew never needs to touch this config again.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name compliance.ai-english-os.online;

    ssl_certificate     /etc/letsencrypt/live/compliance.ai-english-os.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/compliance.ai-english-os.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Keycloak 26 (Quarkus) drops the legacy /auth context path (same
    # correction docker-compose.prod.yml's KC_HOSTNAME comment already
    # made) -- its own top-level paths are matched here and routed to
    # Keycloak; everything else falls through to the API.
    location ~ ^/(realms|resources|robots\.txt|js|admin)(/|$) {
      set $keycloak_upstream http://keycloak:8080;
      proxy_pass $keycloak_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      set $api_upstream http://api:3000;
      proxy_pass $api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
