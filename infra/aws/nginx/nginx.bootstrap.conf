# E7 Phase 3 Sub-phase C -- TEMPORARY config, served before a real cert
# exists. infra/aws/setup-tls.sh writes this to /opt/compliance/nginx.conf
# first so Nginx can answer the ACME HTTP-01 challenge on port 80; once
# certbot succeeds, the script overwrites the same path with the real
# nginx.conf (TLS + proxying) and restarts the container. Never proxies
# app traffic itself -- only the challenge path plus a plain 503
# everywhere else, so there is no window where unencrypted app traffic
# is served on the public hostname.
worker_processes auto;
events {
  worker_connections 1024;
}

http {
  server {
    listen 80;
    server_name compliance.ai-english-os.online;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 503;
    }
  }
}
