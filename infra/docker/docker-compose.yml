services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: e0db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_superuser_local_only
    ports:
      - '5432:5432'
    volumes:
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d e0db']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass dev-redis-pass
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a dev-redis-pass ping']
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Pin the issuer/base URL so tokens carry a consistent `iss` regardless
      # of which Host header the caller used to reach Keycloak (localhost
      # from the host machine vs host.docker.internal from a container, e.g.
      # k6 running in Docker) -- otherwise iss mismatches and AuthGuard
      # rejects an otherwise-valid token. See /docs/architecture/decisions.md (ADR-008).
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: 'false'
    ports:
      - '8080:8080'
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/e0-test HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200\\|302' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
