name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# E3: five stages, strictly gated in order (lint -> unit-tests -> integration
# -> security-scan -> build) via `needs:` -- a failure at any stage stops the
# pipeline before the next one starts. Combined with branch protection
# (see CONTRIBUTING.md), no PR can merge into main without all five green.
# See docs/architecture/decisions.md (ADR-024) for why this replaces E1's
# GitHub Actions `services:`-based test-security job.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit

  # Full-stack gate: Postgres + Redis + Keycloak via `docker compose`
  # (not GitHub Actions `services:`, which cannot bind-mount local files --
  # see ADR-015/ADR-023) plus the actual API and worker processes, so every
  # HTTP+Keycloak-dependent test in tests/security/** and all of
  # tests/integration/** runs in CI, not just locally.
  integration:
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://app_user:app_dev_pass_local@localhost:5432/e0db
      DATABASE_MIGRATION_URL: postgresql://migration_user:migration_dev_pass_local@localhost:5432/e0db
      DATABASE_ADMIN_URL: postgresql://postgres:postgres_superuser_local_only@localhost:5432/e0db
      REDIS_URL: redis://:dev-redis-pass@localhost:6379/1
      KEYCLOAK_ISSUER: http://localhost:8080/realms/e0-test
      KEYCLOAK_JWKS_URI: http://localhost:8080/realms/e0-test/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: e0-api
      KEYCLOAK_ADMIN_URL: http://localhost:8080
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASS: admin
      PORT: 3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci

      # apps/api's `nest start` and apps/worker's `node dist/main.js` both
      # resolve @ecs/database and @ecs/shared through their built `dist/`
      # (each workspace's package.json `main` points there) -- on a fresh
      # checkout in this job (no artifacts carried over from `unit-tests`,
      # which runs on its own runner), nothing is built yet. Without this
      # step both processes fail immediately (TS2307 "Cannot find module
      # '@ecs/database'" / MODULE_NOT_FOUND), which a naive readiness check
      # can miss -- see the curl fix below.
      - run: npm run build

      - name: Start Postgres, Redis, Keycloak
        run: docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.test.yml up -d

      - name: Wait for Postgres/Redis/Keycloak healthchecks
        run: |
          COMPOSE="docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.test.yml"
          for i in $(seq 1 60); do
            ids=$($COMPOSE ps -q)
            all_healthy=true
            for id in $ids; do
              status=$(docker inspect --format='{{.State.Health.Status}}' "$id" 2>/dev/null || echo "unknown")
              if [ "$status" != "healthy" ]; then all_healthy=false; fi
            done
            if [ "$all_healthy" = true ] && [ -n "$ids" ]; then
              echo "All services healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Services did not become healthy in time:"
          $COMPOSE ps
          exit 1

      # Docker's own HEALTHCHECK for Keycloak reports "healthy" the first
      # time its `/realms/e0-test` probe succeeds, but under CI-runner load
      # (right after pulling+starting all three images) that single check
      # doesn't guarantee the endpoint is still reachable a few seconds
      # later, when this job actually starts the API and tests fetch a
      # token -- confirmed empirically: the healthcheck step passed, but
      # `npm run test:security` still hit ECONNREFUSED on port 8080 on a
      # live CI run. Requiring 3 consecutive successful responses (not just
      # 1) from the exact realm endpoint the tests use closes that gap.
      - name: Confirm Keycloak realm endpoint is stably reachable
        run: |
          # GitHub Actions runs each `run:` block as `bash -e`. `code=$(curl
          # ...)` as a bare assignment trips `errexit` the instant curl fails
          # to connect, aborting this whole step on its first attempt
          # instead of retrying -- confirmed empirically on a live run (the
          # step failed in <1s with curl exit code 7, well inside the
          # 60s budget below). Using `curl -f` directly as an `if` condition
          # avoids that: a command used as an `if`/`while` condition is
          # exempt from `errexit` regardless of its exit status. `-f` also
          # makes curl itself fail on a non-2xx/3xx response, so this
          # doubles as the "200 or 302" check without parsing status text.
          consecutive=0
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8080/realms/e0-test; then
              consecutive=$((consecutive + 1))
            else
              consecutive=0
            fi
            if [ "$consecutive" -ge 3 ]; then
              echo "Keycloak realm endpoint stable."; exit 0
            fi
            sleep 2
          done
          echo "Keycloak realm endpoint never stabilized:"
          docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.test.yml logs keycloak --tail 100
          exit 1

      - name: Start API (background)
        run: |
          npm run start --workspace=@ecs/api > api.log 2>&1 &
          echo $! > api.pid

      - name: Start worker (background)
        run: |
          npm run start --workspace=@ecs/worker > worker.log 2>&1 &
          echo $! > worker.pid

      - name: Wait for API readiness
        run: |
          for i in $(seq 1 30); do
            if ! kill -0 "$(cat api.pid)" 2>/dev/null; then
              echo "API process died before becoming ready:"; cat api.log; exit 1
            fi
            # Any completed HTTP response (including 404) means the API is
            # up -- checked via curl's own exit code, not by parsing
            # %{http_code} text: on connection refused, curl's `-w` output
            # and a `|| echo 000` fallback both write to stdout, silently
            # concatenating into "000000" (!= "000") and reporting "up" when
            # the connection had actually failed. Confirmed empirically on a
            # real CI run.
            if curl -s -o /dev/null http://localhost:3000/; then
              echo "API is up"; exit 0
            fi
            sleep 2
          done
          echo "API did not come up in time:"; cat api.log; exit 1

      - run: npm run test:security
      - run: npm run test:integration

      - name: Dump API/worker/Keycloak logs
        if: failure()
        run: |
          echo "--- api.log ---"; cat api.log 2>/dev/null || true
          echo "--- worker.log ---"; cat worker.log 2>/dev/null || true
          echo "--- keycloak container logs ---"
          docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.test.yml logs keycloak --tail 200 || true

      - name: Stop API and worker
        if: always()
        run: |
          [ -f api.pid ] && kill "$(cat api.pid)" || true
          [ -f worker.pid ] && kill "$(cat worker.pid)" || true

      - name: Tear down docker compose stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.test.yml down -v

  security-scan:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high

      # No Dockerfiles/container images exist in this repo yet (no production
      # deployment topology -- see docs/architecture/threat-model.md,
      # "Explicitly out of scope for E0/E1"), so there is nothing for Trivy
      # to scan as an image. `trivy fs` is the applicable equivalent today:
      # it scans the dependency tree and repo filesystem for known CVEs and
      # misconfigurations. Re-add an image scan when a Dockerfile is
      # introduced in a later phase.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  build:
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
